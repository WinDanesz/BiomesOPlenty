buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net"
        }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'
apply plugin: 'maven'

// define the properties file
ext.configFile = file "build.properties"

configFile.withReader {
    // read config.  it shall from now on be referenced as simply config or as project.config
    def prop = new Properties()
    prop.load(it)
    project.ext.config = new ConfigSlurper().parse prop
}

group = "com.github.glitchfiend.biomesoplenty"
// why set the version twice?
version = config.mod_version
archivesBaseName = "BiomesOPlenty"

// every commit raises build_number in build.properties
def fullModVersion = "${config.mod_version}.${config.build_number}".toString()
version = "${config.minecraft_version}-${fullModVersion}"

// run tasks launch against forge_version itself, which can be older than the
// floor shipped in release jars, so the floor is only applied to everything else
def isDevRun = gradle.startParameter.taskNames.any { it.tokenize(':').last().startsWith('run') }

minecraft {
    version = config.minecraft_version + "-" + config.forge_version // grab latest forge
    useDepAts = true
    mappings = project.config.mappings_version
    //gradle complains if this isn't set when setting up/using IDEA workspace
    runDir = "run"
    //set a full version string with appended build number to be used in mod registration
    replace '@MOD_VERSION@', fullModVersion
    replace '1.0.0.0', isDevRun ? config.forge_version : config.required_forge_version
    replaceIn 'BiomesOPlenty.java'
}

def commonManifest = {
    attributes 'FMLAT': 'biomesoplenty_at.cfg'
}

jar {
    manifest commonManifest
    classifier = 'universal'
}

processResources {
    // rebuild the expanded files whenever a version changes
    inputs.property 'mod_version', config.mod_version.toString()
    inputs.property 'minecraft_version', config.minecraft_version.toString()
    inputs.property 'build_number', config.build_number.toString()

    from(sourceSets.main.resources.srcDirs) {
        include '**/*.info'
        include '**/*.properties'

        // replaces
        expand ([
            'modid': project.archivesBaseName,
            'mod_version': project.config.mod_version,
            'minecraft_version': project.config.minecraft_version,
            'build_number': project.config.build_number
        ])
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude '**/*.info'
        exclude '**/*.properties'
    }
}


import groovy.io.FileType

def changelogFile = file("build/libs/${archivesBaseName}-${project.version}-changelog.txt")

// The release notes for this build: the section of CHANGELOG.md matching the full version.
task changelog {
    def source = file('CHANGELOG.md')
    inputs.file source
    outputs.file changelogFile
    outputs.upToDateWhen { false } // Refresh changelog for every build

    doLast {
        def heading = /##\s+\[?${java.util.regex.Pattern.quote(fullModVersion)}\]?(\s.*)?/
        def lines = source.readLines('UTF-8')
        def start = lines.findIndexOf { it ==~ heading }
        def section = start < 0 ? [] : lines.drop(start + 1)
        // A section ends at the next version heading or at the link references
        def end = section.findIndexOf { it.startsWith('## ') || it ==~ /\[[^\]]+\]:\s.*/ }
        def text = (end < 0 ? section : section.take(end)).join('\n').trim()

        if (!text) {
            throw new GradleException("CHANGELOG.md needs a '## [${fullModVersion}]' section with at least one entry")
        }

        changelogFile.parentFile.mkdirs()
        changelogFile.setText(text + '\n', 'UTF-8')
    }
}

task sourcesJar(type: Jar) {
    from sourceSets.main.allJava
    from (sourceSets.main.output) {
        include 'LICENSE.txt'
    }

    classifier = 'sources'
}

task deobfJar(type: Jar) {
    from sourceSets.main.output

    manifest commonManifest
    classifier = 'deobf'
}

task apiJar(type: Jar) {
    from(sourceSets.main.allJava) {
        include 'biomesoplenty/api/**'
    }
    from (sourceSets.main.output) {
        include 'LICENSE.txt'
        include 'biomesoplenty/api/**'
    }

    classifier = 'api'
}

task listOutputs << {
    println "Output files:"
    println "--------------------"
    def list = []

    def dir = new File("build/libs/")
    
    if (dir.exists()) {
        dir.eachFileRecurse (FileType.FILES) { file ->
            //Add each file to the list
            list << file
        }
    
        //Print the names of all of the output files
        list.each {
            println it.getName()
        }
    }
    println "--------------------"
}

tasks.build.finalizedBy('listOutputs')

artifacts {
    archives(changelogFile) {
        builtBy changelog
    }
    archives sourcesJar
    archives deobfJar
    archives apiJar
}

uploadArchives {
    repositories {
        mavenDeployer {
			if (System.getenv('MAVEN_USER') && System.getenv('MAVEN_PASSWORD'))
			{
				repository(url: "https://maven.minecraftforge.net/releases/") {
					authentication(userName: System.getenv('MAVEN_USER'), password: System.getenv('MAVEN_PASSWORD'))
				}
			}
			else
			{
				// local repo folder. Might wanna juset use  gradle install   if you wanans end it to maven-local
				repository(url: 'file://localhost/' + project.file('repo').getAbsolutePath())
			}

            pom {
                groupId = project.group
                version = project.version
                artifactId = project.archivesBaseName
                project {
                    name project.archivesBaseName
                    packaging 'jar'
                    description 'Biomes O Plenty'
                    url 'https://github.com/Glitchfiend/BiomesOPlenty'
                
                    scm {
                        url 'https://github.com/Glitchfiend/BiomesOPlenty'
                        connection 'scm:git:git://github.com/Glitchfiend/BiomesOPlenty.git'
                        developerConnection 'scm:git:git@github.com:Glitchfiend/BiomesOPlenty.git'
                    }
                
                    issueManagement {
                        system 'github'
                        url 'https://github.com/Glitchfiend/BiomesOPlenty/issues'
                    }
                
                    licenses {
                        license {
                            name 'Creative Commons Attribution-NonCommercial-NoDerivs 4.0 International Public License'
                            url 'http://creativecommons.org/licenses/by-nc-nd/4.0/'
                            distribution 'repo'
                        }
                    }
                
                    developers {
                        developer {
                            id 'Adubbz'
                            name 'Adubbz'
                            roles { role 'developer' }
                        }
                        developer {
                            id 'Amnet'
                            name 'Amnet'
                            roles { role 'developer' }
                        }
                        developer {
                            id 'Forstride'
                            name 'Forstride'
                            roles { role 'developer' }
                        }
                        developer {
                            id 'ted80'
                            name 'ted80'
                            roles { role 'developer' }
                        }
                    }
                }
            }
        }
    }
}
