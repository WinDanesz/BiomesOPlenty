# The workflow name can't contain expressions, so it stays neutral and the job name says whether this run publishes.
name: Build
on:
  workflow_dispatch:
  pull_request:
    branches: [BOP-1.12.x-7.0.x]
  push:
    branches: [BOP-1.12.x-7.0.x]
env:
  # Only the real branch publishes. Pull requests and forks stop after the build.
  # Job names can't read env, so the job name below repeats this condition; keep the two in sync.
  PUBLISH: ${{ github.repository == 'Glitchfiend/BiomesOPlenty' && github.event_name != 'pull_request' && github.ref == 'refs/heads/BOP-1.12.x-7.0.x' }}
  # The release notes cover the commits since the previous build of the branch, or a pull request's commits
  CHANGELOG_FROM: ${{ github.event.pull_request.base.sha || github.event.before }}
jobs:
  build:
    name: ${{ (github.repository == 'Glitchfiend/BiomesOPlenty' && github.event_name != 'pull_request' && github.ref == 'refs/heads/BOP-1.12.x-7.0.x') && 'Build and publish' || 'Build' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0 # The version and release notes are computed from the git history
    - name: Set up JDK 8
      uses: actions/setup-java@v6
      with:
        java-version: '8'
        distribution: 'temurin'
    - name: Cache Gradle
      uses: actions/cache@v6
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ hashFiles('build.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
    - name: Build
      id: build
      run: ./gradlew --no-daemon build
    - name: Show release notes
      run: |
        cat build/release-info.properties
        cat build/libs/*-changelog.txt
    # A push with only build:, docs:, ci: and similar commits gets a version number but no release.
    # A manual run always publishes.
    - name: Read version
      id: version
      if: env.PUBLISH == 'true'
      run: |
        number="$(sed -n 's/^version=//p' build/release-info.properties)"
        player_facing="$(sed -n 's/^player_facing=//p' build/release-info.properties)"
        echo "number=${number}" >> "$GITHUB_OUTPUT"
        if [ "$player_facing" = true ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
          echo "release=true" >> "$GITHUB_OUTPUT"
        else
          echo "release=false" >> "$GITHUB_OUTPUT"
          echo "::notice::No player-facing commits since the last build, so ${number} isn't published"
        fi

    # Each upload still runs if another fails, and any CurseForge or Modrinth failure fails the job.
    - name: CurseForge Publish
      id: curseforge
      if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.version.outputs.release == 'true' }}
      uses: Kir-Antipov/mc-publish@c23376546a97f5ba7984e94445da359459b14419 # v3.3.2
      with:
        curseforge-id: 220318
        curseforge-token: ${{ secrets.CURSE_API_KEY }}
        files: build/libs/*-universal.jar
        name: Biomes O' Plenty Forge ${{ steps.version.outputs.number }}
        version: ${{ steps.version.outputs.number }}
        version-type: beta
        changelog-file: build/libs/*-changelog.txt
        loaders: forge
        environment: both
        game-versions: 1.12.2
        java: 8
    - name: Modrinth Publish
      id: modrinth
      if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.version.outputs.release == 'true' }}
      uses: Kir-Antipov/mc-publish@c23376546a97f5ba7984e94445da359459b14419 # v3.3.2
      with:
        modrinth-id: biomes-o-plenty
        modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
        modrinth-featured: false
        modrinth-unfeature-mode: none
        files: build/libs/*-universal.jar
        name: ${{ steps.version.outputs.number }} for 1.12.2
        version: ${{ steps.version.outputs.number }}
        version-type: beta
        changelog-file: build/libs/*-changelog.txt
        loaders: forge
        environment: both
        game-versions: 1.12.2
        java: 8
    # Players get the mod from the two sites above, so a Maven problem only warns.
    - name: Maven Publish
      if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.version.outputs.release == 'true' }}
      run: ./gradlew --no-daemon uploadArchives
      continue-on-error: true
      env:
        MAVEN_USER: ${{ secrets.MAVEN_USER }}
        MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
