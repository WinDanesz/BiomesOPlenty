buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net"
        }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'
apply plugin: 'maven'

// define the properties file
ext.configFile = file "build.properties"

configFile.withReader {
    // read config.  it shall from now on be referenced as simply config or as project.config
    def prop = new Properties()
    prop.load(it)
    project.ext.config = new ConfigSlurper().parse prop
}

group = "com.github.glitchfiend.biomesoplenty"
// why set the version twice?
version = config.mod_version
archivesBaseName = "BiomesOPlenty"

// Runs git and returns its trimmed output, or null if git is missing or the command fails
def runGit = { List<String> args ->
    def stdout = new ByteArrayOutputStream()
    try {
        def result = exec {
            commandLine(['git'] + args)
            standardOutput = stdout
            errorOutput = new ByteArrayOutputStream()
            ignoreExitValue = true
        }
        return result.exitValue == 0 ? stdout.toString('UTF-8').trim() : null
    } catch (Exception ignored) {
        return null
    }
}

// The build number is version_base_build plus one for every commit on the branch
// since version_base_commit, so nobody has to bump it by hand
def baseCommit = config.version_base_commit.toString()
def commitsSinceBase = runGit(['merge-base', '--is-ancestor', baseCommit, 'HEAD']) == null ? null :
        runGit(['rev-list', '--count', '--first-parent', baseCommit + '..HEAD'])
if (commitsSinceBase == null) {
    if (System.getenv('CI')) {
        throw new GradleException("Can't count the commits since ${baseCommit}, which CI needs for the version; check out the full history (fetch-depth: 0)")
    }
    logger.warn("Can't count the commits since ${baseCommit}, so this build uses build number 0")
}
config.build_number = (commitsSinceBase == null ? 0 : config.version_base_build.toString().toInteger() + commitsSinceBase.toInteger()).toString()

def fullModVersion = "${config.mod_version}.${config.build_number}".toString()
version = "${config.minecraft_version}-${fullModVersion}"

// run tasks launch against forge_version itself, which can be older than the
// floor shipped in release jars, so the floor is only applied to everything else
def isDevRun = gradle.startParameter.taskNames.any { it.tokenize(':').last().startsWith('run') }

minecraft {
    version = config.minecraft_version + "-" + config.forge_version // grab latest forge
    useDepAts = true
    mappings = project.config.mappings_version
    //gradle complains if this isn't set when setting up/using IDEA workspace
    runDir = "run"
    //set a full version string with appended build number to be used in mod registration
    replace '@MOD_VERSION@', fullModVersion
    replace '1.0.0.0', isDevRun ? config.forge_version : config.required_forge_version
    replaceIn 'BiomesOPlenty.java'
}

def commonManifest = {
    attributes 'FMLAT': 'biomesoplenty_at.cfg'
}

jar {
    manifest commonManifest
    classifier = 'universal'
}

processResources {
    // rebuild the expanded files whenever a version changes
    inputs.property 'mod_version', config.mod_version.toString()
    inputs.property 'minecraft_version', config.minecraft_version.toString()
    inputs.property 'build_number', config.build_number.toString()
    inputs.property 'support_url', config.support_url.toString()

    from(sourceSets.main.resources.srcDirs) {
        include '**/*.info'
        include '**/*.properties'

        // replaces
        expand ([
            'modid': project.archivesBaseName,
            'mod_version': project.config.mod_version,
            'minecraft_version': project.config.minecraft_version,
            'build_number': project.config.build_number,
            'support_url': project.config.support_url
        ])
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude '**/*.info'
        exclude '**/*.properties'
    }
}


import groovy.io.FileType

def changelogFile = file("build/libs/${archivesBaseName}-${project.version}-changelog.txt")
def releaseInfoFile = file('build/release-info.properties')

// Release notes from the commit subjects since CHANGELOG_FROM (the previous commit CI built),
// or from the latest commit when that is unset or unknown. Conventional commit prefixes pick
// the Keep a Changelog heading; build:, docs:, ci: and similar commits aren't player-facing.
task changelog {
    outputs.file changelogFile
    outputs.file releaseInfoFile
    outputs.upToDateWhen { false } // Refresh changelog for every build

    doLast {
        def from = System.getenv('CHANGELOG_FROM')
        def range = (from && runGit(['cat-file', '-e', from + '^{commit}']) != null) ? [from + '..HEAD'] : ['-1']
        def subjects = (runGit(['log', '--no-merges', '--reverse', '--format=%s'] + range) ?: '').readLines()*.trim().findAll()

        def headings = [feat: 'Added', perf: 'Changed', revert: 'Changed', fix: 'Fixed']
        def hidden = ['build', 'chore', 'ci', 'docs', 'refactor', 'style', 'test']
        def sections = ['Added': [], 'Changed': [], 'Fixed': []]
        subjects.each { subject ->
            def match = subject =~ /^(\w+)(\([^)]*\))?!?:\s*(.+)$/
            def type = match.matches() ? match.group(1).toLowerCase() : null
            if (headings.containsKey(type)) {
                sections[headings[type]] << match.group(3)
            } else if (!hidden.contains(type)) {
                sections['Changed'] << subject // no recognised prefix, e.g. translation pull requests
            }
        }

        def text = sections.findAll { it.value }.collect { heading, entries ->
            "### ${heading}\n\n" + entries.collect { "- ${it}" }.join('\n')
        }.join('\n\n')

        // 1.12.2 support doesn't go to the current version's maintainers
        def supportUrl = config.support_url.toString()
        def footer = "---\n\nThis 1.12.2 version is maintained separately from current versions of Biomes O' Plenty. " +
                "Please report 1.12.2 issues on Discord at [${supportUrl - ~/^https?:\/\//}](${supportUrl}), not on GitHub."

        changelogFile.parentFile.mkdirs()
        changelogFile.setText((text ?: 'No player-facing changes.') + '\n\n' + footer + '\n', 'UTF-8')
        releaseInfoFile.setText("version=${fullModVersion}\nplayer_facing=${text ? 'true' : 'false'}\n", 'UTF-8')
    }
}

task sourcesJar(type: Jar) {
    from sourceSets.main.allJava
    from (sourceSets.main.output) {
        include 'LICENSE.txt'
    }

    classifier = 'sources'
}

task deobfJar(type: Jar) {
    from sourceSets.main.output

    manifest commonManifest
    classifier = 'deobf'
}

task apiJar(type: Jar) {
    from(sourceSets.main.allJava) {
        include 'biomesoplenty/api/**'
    }
    from (sourceSets.main.output) {
        include 'LICENSE.txt'
        include 'biomesoplenty/api/**'
    }

    classifier = 'api'
}

task listOutputs << {
    println "Output files:"
    println "--------------------"
    def list = []

    def dir = new File("build/libs/")
    
    if (dir.exists()) {
        dir.eachFileRecurse (FileType.FILES) { file ->
            //Add each file to the list
            list << file
        }
    
        //Print the names of all of the output files
        list.each {
            println it.getName()
        }
    }
    println "--------------------"
}

tasks.build.finalizedBy('listOutputs')

artifacts {
    archives(changelogFile) {
        builtBy changelog
    }
    archives sourcesJar
    archives deobfJar
    archives apiJar
}

uploadArchives {
    repositories {
        mavenDeployer {
			if (System.getenv('MAVEN_USER') && System.getenv('MAVEN_PASSWORD'))
			{
				repository(url: "https://maven.minecraftforge.net/releases/") {
					authentication(userName: System.getenv('MAVEN_USER'), password: System.getenv('MAVEN_PASSWORD'))
				}
			}
			else
			{
				// local repo folder. Might wanna juset use  gradle install   if you wanans end it to maven-local
				repository(url: 'file://localhost/' + project.file('repo').getAbsolutePath())
			}

            pom {
                groupId = project.group
                version = project.version
                artifactId = project.archivesBaseName
                project {
                    name project.archivesBaseName
                    packaging 'jar'
                    description 'Biomes O Plenty'
                    url 'https://github.com/Glitchfiend/BiomesOPlenty'
                
                    scm {
                        url 'https://github.com/Glitchfiend/BiomesOPlenty'
                        connection 'scm:git:git://github.com/Glitchfiend/BiomesOPlenty.git'
                        developerConnection 'scm:git:git@github.com:Glitchfiend/BiomesOPlenty.git'
                    }
                
                    issueManagement {
                        system 'Discord'
                        url project.config.support_url
                    }
                
                    licenses {
                        license {
                            name 'Creative Commons Attribution-NonCommercial-NoDerivs 4.0 International Public License'
                            url 'http://creativecommons.org/licenses/by-nc-nd/4.0/'
                            distribution 'repo'
                        }
                    }
                
                    developers {
                        developer {
                            id 'Adubbz'
                            name 'Adubbz'
                            roles { role 'developer' }
                        }
                        developer {
                            id 'Amnet'
                            name 'Amnet'
                            roles { role 'developer' }
                        }
                        developer {
                            id 'Forstride'
                            name 'Forstride'
                            roles { role 'developer' }
                        }
                        developer {
                            id 'ted80'
                            name 'ted80'
                            roles { role 'developer' }
                        }
                        developer {
                            id 'WinDanesz'
                            name 'WinDanesz'
                            roles { role '1.12.2 maintainer' }
                        }
                    }
                }
            }
        }
    }
}
